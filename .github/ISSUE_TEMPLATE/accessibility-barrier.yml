name: Accessibility barrier report
description: Report a reproducible DSH keyboard, screen-reader, low-vision, motion, cognitive, speech, or other access barrier.
title: "[Barrier]: "
labels:
  - accessibility
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a barrier. Use synthetic or non-sensitive content. Never include credentials, private prompts, conversations, usernames, personal data, or sensitive filesystem paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private content, personal data, usernames, and sensitive paths.
          required: true
        - label: This is an accessibility barrier, not a security, conduct, or unredacted participant-data report.
          required: true
  - type: textarea
    id: versions
    attributes:
      label: Exact environment
      description: Include DSH build/tag, companion version, operating system, browser, assistive technology, language, and relevant verbosity/punctuation/display settings.
      placeholder: |
        DSH: @deepseek-ai/dsh 0.1.2-rc.1 / tag ...
        Companion: 0.1.0-beta.8
        OS and browser:
        Assistive technology:
        UI and speech language:
        Relevant settings:
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and minimal reproduction
      description: Describe the user goal and numbered steps using a disposable workspace or synthetic content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected independent outcome
      description: What should a user be able to perceive, understand, or operate without assistance?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include task completion, focus destination, exposed role/name/state, exact spoken output where relevant, and any workaround.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Functional impact
      options:
        - Blocks a core task with no reasonable workaround
        - Blocks a core task but a workaround exists
        - Causes substantial delay, confusion, or repeated errors
        - Minor friction or documentation gap
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Likely ownership
      options:
        - DSH core default behavior
        - Accessibility companion additive behavior
        - Developer test tooling
        - External AT/browser/platform interoperability
        - Accessible authoring output
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional screenshots, accessibility-tree fragments, speech excerpts, traces, or minimal fixtures. Explain what each artifact proves and does not prove.
