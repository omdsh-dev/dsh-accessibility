name: 无障碍障碍报告
description: 报告可复现的 DSH 键盘、读屏、低视力、动态效果、认知、语音或其他访问障碍。
title: "[无障碍障碍]: "
labels:
  - accessibility
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请使用合成或非敏感内容；不得包含凭据、私人提示词、对话、用户名、个人数据或敏感文件路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除凭据、私人内容、个人数据、用户名和敏感路径。
          required: true
        - label: 这是无障碍障碍，不是安全、行为准则或未脱敏参与者数据报告。
          required: true
  - type: textarea
    id: versions
    attributes:
      label: 精确环境
      description: 请注明 DSH build/tag、companion 版本、操作系统、浏览器、辅助技术、语言，以及相关详细度／标点／显示设置。
      placeholder: |
        DSH：@deepseek-ai/dsh 0.1.2-rc.1 / tag ...
        Companion：0.1.0-beta.8
        操作系统和浏览器：
        辅助技术：
        UI 与语音语言：
        相关设置：
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: 任务和最小复现
      description: 使用一次性工作区或合成内容，描述用户目标和编号步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期独立完成结果
      description: 用户应当能够在没有他人协助的情况下感知、理解或操作什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请记录任务是否完成、焦点落点、暴露的角色／名称／状态、相关时的精确实际朗读，以及变通方式。
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: 功能影响
      options:
        - 阻断核心任务且没有合理变通方式
        - 阻断核心任务但存在变通方式
        - 造成明显延迟、困惑或重复错误
        - 轻微摩擦或文档缺口
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 可能归属
      options:
        - DSH 核心默认行为
        - 无障碍 companion 增量行为
        - 开发测试工具
        - 外部辅助技术／浏览器／平台互操作
        - 无障碍创作输出
        - 不确定
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可选截图、辅助功能树片段、朗读摘录、trace 或最小 fixture。请说明每个材料能够和不能证明什么。
