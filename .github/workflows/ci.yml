name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.19.0, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:peers
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: pnpm run evidence:validate
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm pack --dry-run --json

  assembled-browser:
    name: Assembled DSH browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out companion
        uses: actions/checkout@v7
      - name: Check out exact patched DSH baseline
        uses: actions/checkout@v7
        with:
          repository: omdsh-dev/deepseek-harness
          ref: 54fec68d0e141fba0d7451f33acad78d388674d0
          path: .assembled/dsh
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .assembled/dsh/pnpm-lock.yaml
      - name: Install and build companion
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install and build DSH baseline
        working-directory: .assembled/dsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:official
          pnpm --dir apps/web exec playwright install --with-deps chromium firefox webkit
      - name: Run external-plugin assembled browser protocol
        run: pnpm run test:assembled .assembled/dsh . chromium,firefox,webkit
      - name: Smoke-test disposable AT lab startup and cleanup
        run: pnpm run lab:at .assembled/dsh . none 500

  core-windows-acl:
    name: Core Windows ACL fixture contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact patched DSH baseline
        uses: actions/checkout@v7
        with:
          repository: omdsh-dev/deepseek-harness
          ref: 54fec68d0e141fba0d7451f33acad78d388674d0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install exact core graph
        run: pnpm install --frozen-lockfile
      - name: Run native ACL fixture contract (not full core coverage)
        run: pnpm exec vitest run packages/sandbox/sandbox-windows-acl/tests/diagnose-script.spec.ts --maxWorkers=2

  ci:
    name: CI gate
    if: always()
    needs: [validate, assembled-browser, core-windows-acl]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          ASSEMBLED_RESULT: ${{ needs.assembled-browser.result }}
          WINDOWS_ACL_RESULT: ${{ needs.core-windows-acl.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$ASSEMBLED_RESULT" = success
          test "$WINDOWS_ACL_RESULT" = success
