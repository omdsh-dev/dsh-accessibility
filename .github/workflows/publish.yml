name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish with provenance
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - name: Verify release tag
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "$expected" ]]; then
            echo "Expected tag $expected, got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Publish
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=next ;;
            *-*) echo "Unsupported prerelease channel: $version" >&2; exit 1 ;;
            *) channel=latest ;;
          esac
          npx --yes npm@11.19.0 publish --access public --provenance --tag "$channel"
